name: CI/CD Pipeline

on:
  push:
    branches:
      - '*'
    tags:
      - '*'  
  pull_request:
    branches:
      - '*'
  release:
    types: [created]  # This triggers on GitHub release creation
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Tag Docker Images
        run: |
          docker build -t defects-stats ./app/backend/defects-removed-service

      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Set version from Git tag
        if: startsWith(github.ref, 'refs/tags/')
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Tag and Push Images
        run: |
          VERSION=${{ github.event.inputs.release_version || 'latest' }}
          echo "Using version $VERSION"
          docker tag defects-stats mkapure/defects-stats:$VERSION

          
          docker push mkapure/defects-stats:$VERSION



          docker tag defects-stats mkapure/defects-stats:$VERSION


          docker push mkapure/defects-stats:latest



          docker push mkapure/defects-stats:$VERSION



  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r app/backend/python-backend/requirements.txt
          pip install pytest

      - name: Run Code Comment Coverage Tests
        run: |
          cd app/backend/python-backend/code-comment

      - name: Run app.py tests
        run: |
          cd app/backend/python-backend
          pytest tests/test_app.py
