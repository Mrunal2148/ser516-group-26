name: CI/CD Pipeline

on:
  push:
    branches:
      - Period-3
      - dev
  pull_request:
    branches:
      - Period-3
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build and Tag Docker Images
        run: |
          docker build -t app-python-backend ./app/backend/python-backend
          docker build -t app-java-backend ./app/backend
          docker build -t app-frontend ./app/frontend
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          echo "${{ secrets.DOCKER_PASSWORD }}"
      
      - name: Tag and push images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker tag app-python-backend ser516/app-python-backend:latest
          docker tag app-java-backend ser516/app-java-backend:latest
          docker tag app-frontend ser516/app-frontend:latest
          
          docker push ser516/app-python-backend:latest
          docker push ser516/app-java-backend:latest
          docker push ser516/app-frontend:latest
