name: CI/CD Pipeline

on:
  push:
    branches:
      - '*'
    tags:
      - '*'  
  pull_request:
    branches:
      - '*'
  release:
    types: [created]  # This triggers on GitHub release creation
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Tag Docker Images
        run: |
          docker build -t fogindex ./app/fogindex -f ./app/fogindex/Dockerfile
      - name: Log in to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Determine VERSION
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "VERSION=${{ github.event.inputs.release_version }}" >> $GITHUB_ENV
          elif [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> $GITHUB_ENV
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "VERSION=${GITHUB_REF##*/}" >> $GITHUB_ENV
          else
            echo "VERSION=latest" >> $GITHUB_ENV
          fi

      - name: Tag and Push Images
        run: |
          echo "Using version $VERSION"
          docker tag fogindex mkapure/fogindex:$VERSION
          docker push mkapure/fogindex:$VERSION
          docker tag fogindex mkapure/fogindex:$VERSION
          docker push mkapure/fogindex:$VERSION
        
          docker tag fogindex mkapure/fogindex:latest
          docker push mkapure/fogindex:latest
          docker tag fogindex mkapure/fogindex:latest
          docker push mkapure/fogindex:latest


  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r app/backend/python-backend/requirements.txt
          pip install pytest

      - name: Run Code Comment Coverage Tests
        run: |
          cd app/backend/python-backend/code-comment

      - name: Run app.py tests
        run: |
          cd app/backend/python-backend
          pytest tests/test_app.py

      - name: Make gradlew executable
        run: chmod +x app/fogindex/gradlew

      - name: Run FogIndex Tests
        run: |
          cd app/fogindex
          ./gradlew test
